spring.webflux.base-path=/coolkid-rss
server.port=8081

spring.jackson.time-zone=Asia/Shanghai
spring.jackson.locale=zh_CN

spring.cache.type=redis
spring.cache.redis.time-to-live=PT5M

logging.level.root=${CRW_SERVER_LOG_LEVEL:info}
logging.file.name=${CRW_SERVER_LOG_NAME:coolkidrss.log}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} === [%thread]=== %-5level %logger{50} - %msg%n
logging.charset.file=UTF-8

coolkidrss.devmode=false

spring.data.mongodb.uri=${CRW_MONGODB_URL}

spring.data.redis.host=${CRW_REDIS_HOST}
spring.data.redis.port=${CRW_REDIS_PORT:6379}
spring.data.redis.password=${CRW_REDIS_PW}
spring.data.redis.database=${CRW_REDIS_DB:1}

coolkidrss.databaseId=${CRW_SNID_DB:1}
coolkidrss.nodeId=${CRW_SNID_ND:1}
coolkidrss.clean.data=${CRW_SETTING_CLEAN_DATA:false}
coolkidrss.keep.data.month=${CRW_SETTING_CLEAN_DATA_MONTH:12}
coolkidrss.rss.queue.name=coolkid-rss-update-queue
coolkidrss.rss.queue.lock-name=coolkid-rss-webflux-update-lock-